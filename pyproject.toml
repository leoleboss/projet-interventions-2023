[project]
name = "firerescuedash"
version = "0.1.0"
description = "Reporting Excel automatisé sur les interventions des services de secours en 2023"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
]

[project.scripts]
firerescuedash = "firerescuedash.main:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
